<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vanguard - Endless Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 overflow-hidden text-white select-none">
    <canvas id="gameCanvas" class="absolute top-0 left-0 w-full h-full z-0"></canvas>

    <div id="damageOverlay" class="pointer-events-none absolute inset-0 bg-red-600 opacity-0 transition-opacity duration-100 z-10"></div>

    <div id="hud" class="absolute top-0 left-0 w-full h-full pointer-events-none z-20 hidden p-6 flex flex-col justify-between">
        <div class="flex justify-between items-start">
            <div class="glass-panel p-4 rounded-lg w-64 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                <h2 class="text-cyan-400 font-bold uppercase tracking-widest text-sm mb-1">Integrity</h2>
                <div class="w-full bg-gray-800 h-4 rounded overflow-hidden">
                    <div id="healthBar" class="bg-cyan-500 h-full w-full shadow-[0_0_10px_rgba(6,182,212,0.8)] transition-all duration-200"></div>
                </div>
                <div class="mt-3 flex justify-between text-xs text-gray-400 font-mono">
                    <span>LVL <span id="levelDisplay" class="text-cyan-300 text-lg">1</span></span>
                    <span>SCORE: <span id="scoreDisplay" class="text-white">0</span></span>
                </div>
            </div>
            <div class="glass-panel p-3 rounded-lg text-center border border-red-500/30 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                <span class="text-red-400 text-xs font-bold tracking-widest block">SURVIVAL TIME</span>
                <span id="timeDisplay" class="text-2xl font-mono text-white">00:00</span>
            </div>
        </div>

        <div class="w-full flex flex-col items-center pb-4">
            <span class="text-xs text-cyan-400 mb-1 tracking-widest">EXPERIENCE DATA</span>
            <div class="w-3/4 max-w-2xl bg-gray-800/80 h-2 rounded-full overflow-hidden backdrop-blur-sm border border-gray-700">
                <div id="xpBar" class="bg-cyan-400 h-full w-0 transition-all duration-300 shadow-[0_0_8px_rgba(6,182,212,1)]"></div>
            </div>
        </div>
    </div>

    <div id="mainMenu" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900/90 backdrop-blur-md z-50">
        <div class="text-center mb-12">
            <h1 class="text-7xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 drop-shadow-[0_0_20px_rgba(6,182,212,0.5)] mb-2">NEON VANGUARD</h1>
            <p class="text-gray-400 tracking-widest">TACTICAL SURVIVAL PROTOCOL</p>
        </div>

        <h2 class="text-white text-xl font-bold tracking-widest mb-6 uppercase border-b border-gray-700 pb-2">Select Game Mode</h2>
        <div class="flex gap-6 max-w-4xl px-6">
            
            <button id="btnStandard" class="flex-1 glass-panel p-6 rounded-lg border border-cyan-500/30 hover:border-cyan-400 hover:shadow-[0_0_30px_rgba(6,182,212,0.4)] transition-all hover:-translate-y-2 group text-left relative overflow-hidden">
                <div class="absolute inset-0 bg-cyan-500/10 w-0 group-hover:w-full transition-all duration-300"></div>
                <h3 class="text-2xl text-cyan-400 font-bold tracking-wider mb-2 relative z-10">STANDARD</h3>
                <p class="text-gray-400 text-sm mb-4 relative z-10">The classic endless survival experience. Scale your power, fight off the swarm, and survive as long as possible.</p>
                <div class="flex gap-2 relative z-10">
                    <span class="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-600">Standard HP</span>
                    <span class="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-600">Normal Spawns</span>
                </div>
            </button>

            <button id="btnHardcore" class="flex-1 glass-panel p-6 rounded-lg border border-red-500/30 hover:border-red-500 hover:shadow-[0_0_30px_rgba(239,68,68,0.4)] transition-all hover:-translate-y-2 group text-left relative overflow-hidden">
                <div class="absolute inset-0 bg-red-500/10 w-0 group-hover:w-full transition-all duration-300"></div>
                <h3 class="text-2xl text-red-500 font-bold tracking-wider mb-2 relative z-10">HARDCORE</h3>
                <p class="text-gray-400 text-sm mb-4 relative z-10">Lethal combat protocol. One hit kills you. Enemies spawn aggressively, but you level up twice as fast.</p>
                <div class="flex gap-2 relative z-10">
                    <span class="text-xs bg-red-900/50 text-red-300 px-2 py-1 rounded border border-red-700">1 HP (Insta-Death)</span>
                    <span class="text-xs bg-red-900/50 text-red-300 px-2 py-1 rounded border border-red-700">2x XP Gain</span>
                </div>
            </button>

        </div>
    </div>

    <div id="upgradeScreen" class="absolute inset-0 flex items-center justify-center bg-gray-900/80 backdrop-blur-md z-40 hidden">
        <div class="w-full max-w-4xl p-8">
            <h2 class="text-3xl text-cyan-400 font-bold text-center mb-2 tracking-widest uppercase">System Upgrade Available</h2>
            <p class="text-center text-gray-400 mb-8">Select enhancement protocol:</p>
            <div id="upgradeCards" class="grid grid-cols-3 gap-6">
            </div>
        </div>
    </div>

    <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 backdrop-blur-md z-50 hidden">
        <h1 class="text-6xl font-black tracking-widest text-red-500 mb-4 drop-shadow-[0_0_20px_rgba(239,68,68,0.8)]">SYSTEM FAILURE</h1>
        <p class="text-xl text-gray-300 mb-2">Survival Time: <span id="finalTime" class="text-white font-mono">00:00</span></p>
        <p class="text-xl text-gray-300 mb-8">Final Score: <span id="finalScore" class="text-white font-mono">0</span></p>
        
        <div class="flex gap-4">
            <button id="restartBtn" class="px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded shadow-[0_0_20px_rgba(239,68,68,0.6)] hover:shadow-[0_0_30px_rgba(239,68,68,1)] transition-all hover:scale-105 uppercase tracking-widest">
                Reboot Sequence
            </button>
            <button id="homeBtn" class="px-8 py-4 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded border border-gray-600 shadow-[0_0_20px_rgba(75,85,99,0.4)] hover:shadow-[0_0_30px_rgba(156,163,175,0.6)] transition-all hover:scale-105 uppercase tracking-widest">
                Main Menu
            </button>
        </div>
    </div>

    <script type="module" src="js/game.js"></script>

</body>
</html>
